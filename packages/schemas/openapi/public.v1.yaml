{
  "openapi": "3.1.0",
  "info": {
    "title": "ONJEON 공개 API v1 (초안)",
    "version": "1.0.0-draft.1",
    "description": "C-14. 비로그인. 공개 캐시 가능하며 캐시 키에 release_id·comparison_basis를 포함한다. 모든 2xx 응답 본문에 release_id가 있다. 초안이며 서비스 구현(T-AP-*)이 없다. 근거: 02_구현계약 §2.1·§4, SYSTEM_CONTRACT §10."
  },
  "x-onjeon-surface": "public",
  "x-onjeon-cache-policy": {
    "kind": "public_keyed",
    "note": "GET은 공개 캐시 가능(키: release_id 및 `x-onjeon-cache-key`). POST와 오류는 no-store"
  },
  "paths": {
    "/v1/releases/current": {
      "get": {
        "operationId": "get_current_release",
        "summary": "현재 공개 릴리스",
        "tags": [
          "release"
        ],
        "description": "모든 공개 응답은 이 release_id를 echo한다.",
        "responses": {
          "200": {
            "description": "성공",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/CacheControlPublic"
              },
              "X-Onjeon-Release-Id": {
                "$ref": "#/components/headers/ReleaseId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CurrentReleaseResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        },
        "x-onjeon-cache-key": [
          "release_id"
        ]
      }
    },
    "/v1/products": {
      "get": {
        "operationId": "list_products",
        "summary": "상품·판매 구성 목록",
        "tags": [
          "products"
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": false,
            "description": "검색어",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "org",
            "in": "query",
            "required": false,
            "description": "보험사",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "concept",
            "in": "query",
            "required": false,
            "description": "개념 ID",
            "schema": {
              "$ref": "../json/common.schema.json#/$defs/Identifier"
            }
          },
          {
            "name": "sale_status",
            "in": "query",
            "required": false,
            "description": "판매 상태",
            "schema": {
              "$ref": "../json/vocabulary.schema.json#/$defs/sale_status"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "다음 쪽 커서",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "성공",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/CacheControlPublic"
              },
              "X-Onjeon-Release-Id": {
                "$ref": "#/components/headers/ReleaseId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProductListResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        },
        "x-onjeon-cache-key": [
          "release_id",
          "q",
          "org",
          "concept",
          "sale_status",
          "cursor"
        ]
      }
    },
    "/v1/coverages/{cov_id}": {
      "get": {
        "operationId": "get_coverage",
        "summary": "담보 상세",
        "tags": [
          "coverages"
        ],
        "description": "cov_id는 `/`를 포함하므로 경로에서 퍼센트 인코딩한다.",
        "parameters": [
          {
            "name": "cov_id",
            "in": "path",
            "required": true,
            "description": "담보 ID",
            "schema": {
              "$ref": "../json/common.schema.json#/$defs/CoverageId"
            }
          },
          {
            "name": "release_id",
            "in": "query",
            "required": false,
            "description": "특정 릴리스로 고정해 읽기",
            "schema": {
              "$ref": "../json/common.schema.json#/$defs/ReleaseId"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "성공",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/CacheControlPublic"
              },
              "X-Onjeon-Release-Id": {
                "$ref": "#/components/headers/ReleaseId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../json/coverage_detail.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        },
        "x-onjeon-cache-key": [
          "release_id",
          "cov_id"
        ]
      }
    },
