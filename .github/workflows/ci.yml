name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  rules-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vocabulary (canonical states, generated doc, deprecated names)
        run: python3 tools/vocab_check.py
      - name: Validation set (verbatim quotes, hashes, vocabulary codes, references)
        run: python3 tools/validation_check.py
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (golden, mutation, soundness, loader, real clauses, screen numbers)
        run: cargo test --all
