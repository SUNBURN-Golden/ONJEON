[package]
name = "onjeon-contracts"
version = "0.1.0"
edition = "2021"
description = "ONJEON wire contracts: vocabulary enums and view/result types generated from packages/schemas"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
onjeon-rules-engine = { path = "../rules-engine" }
