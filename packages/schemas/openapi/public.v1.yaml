  "components": {
    "headers": {
      "ReleaseId": {
        "description": "응답이 기댄 릴리스. 본문 release_id와 같다. 오류 응답에서는 릴리스가 정해지지 않았으면 없다",
        "schema": {
          "$ref": "../json/common.schema.json#/$defs/ReleaseId"
        }
      },
      "CacheControl": {
        "description": "오류·계산 응답은 공개 캐시에 넣지 않는다",
        "schema": {
          "type": "string",
          "pattern": "^no-store$"
        }
      },
      "CacheControlNoStore": {
        "description": "POST 응답은 공개 캐시에 넣지 않는다(서버 안 캐시는 입력 해시 + release_id + comparison_basis_id 키)",
        "schema": {
          "type": "string",
          "pattern": "^no-store$"
        }
      },
      "CacheControlPublic": {
        "description": "공개 캐시 가능. 키에 release_id와 비교 조건을 포함한다(`x-onjeon-cache-key`). 유효 시간 숫자는 T-AP-01이 정한다",
        "schema": {
          "type": "string",
          "pattern": "^public(, [a-z-]+(=[0-9]+)?)*$"
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "입력 검증 실패(클래스 V). 알 수 없는 enum 값은 성공으로 기본 처리하지 않는다",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/CacheControl"
          },
          "X-Onjeon-Release-Id": {
            "$ref": "#/components/headers/ReleaseId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../json/error_response.schema.json"
            }
          }
        }
      },
      "NotFound": {
        "description": "없음(클래스 N). 릴리스가 없거나 철회됐을 때도 이 응답이다",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/CacheControl"
          },
          "X-Onjeon-Release-Id": {
            "$ref": "#/components/headers/ReleaseId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../json/error_response.schema.json"
            }
          }
        }
      },
      "Conflict": {
        "description": "상태 충돌(클래스 S). 멱등 키를 다른 내용으로 다시 썼거나 릴리스가 철회됨",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/CacheControl"
          },
          "X-Onjeon-Release-Id": {
            "$ref": "#/components/headers/ReleaseId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../json/error_response.schema.json"
            }
          }
        }
      },
      "RateLimited": {
        "description": "한도(클래스 L). 요청 제한 또는 비용 상한",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/CacheControl"
          },
          "X-Onjeon-Release-Id": {
            "$ref": "#/components/headers/ReleaseId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../json/error_response.schema.json"
            }
          }
        }
      },
      "Unsupported": {
        "description": "미지원(클래스 U). 엔진이 지원하지 않는 의미론 또는 범위 밖 날짜",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/CacheControl"
          },
          "X-Onjeon-Release-Id": {
            "$ref": "#/components/headers/ReleaseId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../json/error_response.schema.json"
            }
          }
        }
      },
      "Internal": {
        "description": "내부 오류(클래스 X)",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/CacheControl"
          },
          "X-Onjeon-Release-Id": {
            "$ref": "#/components/headers/ReleaseId"
          }
        },
        "content": {
          "application/json": {
