        "tags": [
          "comparisons"
        ],
        "description": "cov_ids 또는 concept_id 중 정확히 하나. 가격은 같은 비교 기준 안에서만 비교한다. 확인 필요 상품도 같은 목록에 있다.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ComparisonRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "성공",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/CacheControlNoStore"
              },
              "X-Onjeon-Release-Id": {
                "$ref": "#/components/headers/ReleaseId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../json/compare_view.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          },
          "504": {
            "$ref": "#/components/responses/Timeout"
          },
          "422": {
            "$ref": "#/components/responses/Unsupported"
          }
        },
        "x-onjeon-cache-key": [
          "release_id",
          "comparison_basis_id"
        ]
      }
    },
    "/v1/scenarios": {
      "post": {
        "operationId": "create_scenario",
        "summary": "시나리오 계산",
        "tags": [
          "scenarios"
        ],
        "description": "개인 데이터 없음. 결과는 저장하지 않는다(서버 안 캐시만). 타임아웃을 지급 불가로 바꾸지 않는다.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ScenarioRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "성공",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/CacheControlNoStore"
              },
              "X-Onjeon-Release-Id": {
                "$ref": "#/components/headers/ReleaseId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../json/scenario_result.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          },
          "504": {
            "$ref": "#/components/responses/Timeout"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/Unsupported"
          }
        }
      }
    },
    "/v1/evidence/{ref}": {
      "get": {
        "operationId": "get_evidence",
        "summary": "근거 사슬 한 단계",
        "tags": [
          "evidence"
        ],
        "description": "D-12 결정 전: 페이지 이미지 없음, 짧은 인용은 quote_shown=false. ref는 evidence_ref 문법(`../json/common.schema.json`)이고 경로에서 퍼센트 인코딩한다.",
        "parameters": [
          {
            "name": "ref",
            "in": "path",
            "required": true,
            "description": "evidence_ref",
            "schema": {
              "$ref": "../json/common.schema.json#/$defs/EvidenceRef"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "성공",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/CacheControlPublic"
              },
              "X-Onjeon-Release-Id": {
                "$ref": "#/components/headers/ReleaseId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../json/evidence_view.schema.json"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        },
        "x-onjeon-cache-key": [
          "release_id",
          "ref"
        ]
      }
    },
