[package]
name = "onjeon-api-types"
version = "0.1.0"
edition = "2021"
description = "ONJEON API v1 server types (public, personal, console) generated from packages/schemas/openapi"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Reserved skeleton operations and their types (제3부 §58). Off by default; turning it on is a separate decision.
skeleton = []

[dependencies]
onjeon-contracts = { path = "../schemas" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
