    "/v1/coverage-status": {
      "get": {
        "operationId": "get_coverage_status",
        "summary": "범위와 최신성",
        "tags": [
          "coverage"
        ],
        "description": "분모 근거 없이 '전수' 문자열을 쓰지 않는다(I17 린트).",
        "parameters": [
          {
            "name": "org",
            "in": "query",
            "required": false,
            "description": "보험사",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "concept",
            "in": "query",
            "required": false,
            "description": "개념 ID",
            "schema": {
              "$ref": "../json/common.schema.json#/$defs/Identifier"
            }
          }
        ],
        "responses": {
          "200": {
