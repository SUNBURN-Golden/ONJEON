name: ci

on:
  push:
    branches: [main, "claude/**"]
  # The PR body traceability guard runs in the separate `pr-traceability` workflow.
  # Keeping it out of this workflow means a body edit re-runs only that small check
  # and can never replace a failed or not-yet-run code/test job with success.
  pull_request:

# PR-head code runs here, so the token is read-only and is not left in .git/config.
permissions:
  contents: read

# The runner's directory-local pin does not select Rust for workspace commands.
env:
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  rules-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # The tagged contract baseline is selected from the full history.
      - name: Workflow token permissions and immutable action refs
        run: |
          python3 tools/workflow_check.py .github/workflows/ci.yml .github/workflows/sources.yml \
            .github/workflows/pr-traceability.yml .github/workflows/runner-verify.yml
          python3 -m unittest discover -s tools/tests -p test_workflow_pins.py -v
      - name: Tracked credentials and virtual environments
        run: python3 -I tools/check_tracked_secrets.py
      - name: Product purpose progress
        continue-on-error: true
        shell: bash
        run: python3 -I tools/release_readiness/progress.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Registry normalization regressions
        run: python3 -m unittest discover -s tools/tests -p test_registry_normalize.py -v
      - name: Registry CSV references and access evidence
        run: python3 -I tools/registry_check.py
      - name: Vocabulary (canonical states, generated doc, deprecated names, registry CSVs)
        run: python3 tools/vocab_check.py
      - name: Validation set internal consistency (extracts and metadata; originals are checked by the manual `sources` workflow)
        run: python3 tools/validation_check.py
      - name: Validation checker self-test (each known tampering must fail for its intended reason)
        run: python3 tools/validation_check.py --selftest
      - name: Python test dependency (S3-compatible store tests need conditional put, boto3 >= 1.35)
        run: python3 -m pip install --quiet --user --break-system-packages boto3==1.43.100
      # Python discovery needs a runner even when the Cargo cache is empty.
      - name: Ontology case runner for Python regressions
        working-directory: docs/blueprint/proposals/온톨로지/검증/runner
        run: cargo build --locked --target-dir "$RUNNER_TEMP/onto"
      - name: Python unit tests (content hash, archive writes, reproduction, store providers; archived originals are not in CI)
        env:
          ONJEON_ONTOLOGY_RUNNER: ${{ runner.temp }}/onto/debug/ontology-case-runner
        run: python3 -m unittest discover -s tools/tests -v
      - name: Daemon builder credentials expire with the lease (local verification remote only)
        run: python3 -m unittest tools.daemon.runner_verify.tests.test_runner_verify.CredentialLeaseFencing -v
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (golden, mutation, soundness, loader, real clauses, screen numbers)
        run: cargo test --all --locked
      - name: JSON Schema compatibility with the previous tagged clients
        env:
          ONJ_COMPAT_ALL_CLIENTS: "1"
        run: |
          contract_tools="$RUNNER_TEMP/contract-tools"
          mkdir -p "$contract_tools"
          npm install --prefix "$contract_tools" --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
          dart_zip="$contract_tools/dartsdk-linux-x64-release.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$dart_zip" \
            https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.5/sdk/dartsdk-linux-x64-release.zip
          echo "ea864bc64df30a6b8bdf30b2e32550f7717d9a890de8f40293aeabb924fe232b  $dart_zip" | sha256sum --check
          unzip -q "$dart_zip" -d "$contract_tools"
          export PATH="$contract_tools/node_modules/.bin:$contract_tools/dart-sdk/bin:$PATH"
          bash packages/schemas/codegen/check_compat.sh --latest
          python3 -I -m unittest discover -s packages/schemas/codegen/tests -p test_compat.py -k all_clients -v
      - name: Scenario API input and result regressions
        run: cargo test --manifest-path services/scenario-api/Cargo.toml --locked --target-dir target/scenario-api
      - name: Blueprint counts (engine tests/doctests, real-clause rules, tamper tests, vocabulary axes)
        run: python3 -I tools/blueprint_counts.py

  design-specs:
    # 토의 자료(docs/blueprint/proposals)의 기계 검사. 설계 문서의 의미 검토를 대신하지 않는다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Ontology case runner (rules engine only; computes nothing itself)
        working-directory: docs/blueprint/proposals/온톨로지/검증/runner
        run: cargo build --locked --target-dir "$RUNNER_TEMP/onto"
      - name: Ontology runner original-rule identity and I/O tests
        working-directory: docs/blueprint/proposals/온톨로지/검증/runner
        run: cargo test --locked --target-dir "$RUNNER_TEMP/onto"
      - name: Ontology runner fields and per-job error regressions
        run: ONJEON_ONTOLOGY_RUNNER="$RUNNER_TEMP/onto/debug/ontology-case-runner" python3 -m unittest discover -s tools/tests -p test_ontology_runner_io_error.py -v
      - name: Ontology check (constraints, frozen releases, document model, question flow, self-tests)
        run: python3 -I docs/blueprint/proposals/온톨로지/검증/ontology_check.py "$RUNNER_TEMP/onto/debug/ontology-case-runner"
      - name: Design bundle semantic check (task graph, path permissions, final gate, daemon transitions, switch signals)
        run: python3 -I docs/blueprint/proposals/설계검토_결과/검증/spec_check.py
      - name: Daemon dry run (all T-OP-00 required tests must execute)
        run: python3 -I tools/daemon/dry_run.py --rules docs/blueprint/proposals/설계검토_결과/daemon_rules.json --tasks tools/daemon/mock_tasks.json --scenario all --require-all --quiet
