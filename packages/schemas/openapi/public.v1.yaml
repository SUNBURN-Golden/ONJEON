                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        },
        "x-onjeon-cache-key": [
          "release_id",
          "org",
          "concept"
        ]
      }
    },
    "/v1/gaps": {
      "get": {
        "operationId": "list_gaps",
        "summary": "지식 공백",
        "tags": [
          "coverage"
        ],
        "parameters": [
          {
            "name": "about",
            "in": "query",
            "required": false,
            "description": "대상",
            "schema": {
              "$ref": "../json/common.schema.json#/$defs/Identifier"
            }
