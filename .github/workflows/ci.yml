name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# PR-head code runs here, so the token is read-only and is not left in .git/config.
permissions:
  contents: read

jobs:
  rules-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vocabulary (canonical states, generated doc, deprecated names)
        run: python3 tools/vocab_check.py
      - name: Validation set internal consistency (extracts and metadata; originals are checked by the manual `sources` workflow)
        run: python3 tools/validation_check.py
      - name: Validation checker self-test (each known tampering must fail for its intended reason)
        run: python3 tools/validation_check.py --selftest
      - name: Python test dependency (S3-compatible store tests need conditional put, boto3 >= 1.35)
        run: python3 -m pip install --quiet --user --break-system-packages boto3==1.43.100
      - name: Python unit tests (content hash, archive writes, reproduction, store providers; archived originals are not in CI)
        run: python3 -m unittest discover -s tools/tests -v
      - name: Toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (golden, mutation, soundness, loader, real clauses, screen numbers)
        run: cargo test --all

  design-specs:
    # 토의 자료(docs/blueprint/proposals)의 기계 검사. 설계 문서의 의미 검토를 대신하지 않는다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ontology case runner (rules engine only; computes nothing itself)
        run: cargo build --manifest-path docs/blueprint/proposals/온톨로지/검증/runner/Cargo.toml --target-dir "$RUNNER_TEMP/onto"
      - name: Ontology check (constraints, frozen releases, document model, question flow, self-tests)
        run: python3 -I docs/blueprint/proposals/온톨로지/검증/ontology_check.py "$RUNNER_TEMP/onto/debug/ontology-case-runner"
      - name: Design bundle semantic check (task graph, path permissions, final gate, daemon transitions, switch signals)
        run: python3 -I docs/blueprint/proposals/설계검토_결과/검증/spec_check.py
