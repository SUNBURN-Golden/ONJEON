  "openapi": "3.1.0",
  "info": {
    "title": "ONJEON 개인 API v1 (초안)",
    "version": "1.0.0-draft.1",
    "description": "C-15. 인증 필수. 모든 응답(오류 포함)은 `Cache-Control: private, no-store`이고 공개 캐시를 금지한다. 로그에 본문을 남기지 않는다. 모든 2xx 응답 본문에 release_id가 있다. 스켈레톤 경로는 `x-onjeon-skeleton: true`이고 플래그 기본 off다. 근거: 02_구현계약 §2.2·§4, 제3부 §46.4·§58."
  },
  "x-onjeon-surface": "personal",
  "security": [
    {
      "session": []
    }
  ],
  "x-onjeon-cache-policy": {
    "kind": "private_no_store",
    "public_cache": "forbidden",
    "forbidden_directives": [
      "public",
      "s-maxage",
      "max-age",
      "stale-while-revalidate",
      "stale-if-error",
      "immutable"
    ]
  },
  "x-onjeon-logging": "request and response bodies are never logged",
