[package]
name = "onjeon-collect"
version = "0.1.0"
edition = "2021"
description = "ONJEON source preservation client (T-DT-01): write-once key layout, conditional puts, observation records, R2 budget gate"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "onjeon-collect"
path = "src/main.rs"

[dependencies]
onjeon-contracts = { path = "../../packages/schemas" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
