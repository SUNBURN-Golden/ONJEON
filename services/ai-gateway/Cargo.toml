[package]
name = "onjeon-ai-gateway"
version = "0.1.0"
edition = "2021"
description = "ONJEON AI gateway: multi-provider adapters, call records (C-19), JSON Schema output check, cost caps"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
onjeon-contracts = { path = "../../packages/schemas" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
