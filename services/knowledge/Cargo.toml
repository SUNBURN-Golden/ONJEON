[package]
name = "onjeon-knowledge"
version = "0.1.0"
edition = "2021"
description = "Append-only public knowledge repository and service-conformance ingestion gates"
publish = false

[dependencies]
onjeon-ontology = { path = "../../packages/ontology" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
