name: onjeon_mobile
description: ONJEON consumer app skeleton (4 tabs, three entry points, common screen states). No feature screens yet.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.0.0
  onjeon_contracts:
    path: ../../packages/schemas/codegen/generated/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
