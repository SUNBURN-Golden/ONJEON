    "description": "C-16. 운영자·정책 소유자·읽기 역할, 2FA. 모든 응답은 `private, no-store`. 사용자 원본·건강정보는 어떤 응답에도 없다. release_id는 응답 시점의 현재 공개 릴리스이며 첫 릴리스 전에는 null이다. 근거: 02_구현계약 §2.3."
  },
  "x-onjeon-surface": "console",
  "security": [
    {
      "session": []
    }
  ],
  "x-onjeon-requires-2fa": true,
  "x-onjeon-cache-policy": {
    "kind": "private_no_store",
    "public_cache": "forbidden",
    "forbidden_directives": [
      "public",
      "s-maxage",
      "max-age",
      "stale-while-revalidate",
      "stale-if-error",
      "immutable"
    ]
  },
